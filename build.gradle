plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
        content {
            includeGroupByRegex("net\\.runelite.*")
        }
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion


    testImplementation 'junit:junit:4.12'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.fliptracker'
version = '1.0.0'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

// ./gradlew runClient  -> launches RuneLite with this plugin loaded (developer mode)
tasks.register('runClient', JavaExec) {
    group = 'application'
    description = 'Run RuneLite with the Flip Tracker plugin loaded'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.fliptracker.FlipTrackerPluginTest'
    jvmArgs '-ea'
    args '--developer-mode'
}
